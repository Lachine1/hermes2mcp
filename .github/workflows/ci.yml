name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install adapter and development dependencies
        run: python -m pip install '.[dev]'
      - name: Lint and format
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: HTTP and contract tests
        run: python -m pytest -m 'not hermes' -q --junitxml=pytest-results.xml
      - name: Build distributions
        run: python -m build
      - name: Installed console entry point
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          hermes2mcp --version
          hermes2mcp --help
